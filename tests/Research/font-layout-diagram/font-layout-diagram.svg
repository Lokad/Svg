<svg xmlns="http://www.w3.org/2000/svg" width="432" height="320" viewBox="0 0 432 320">
  <title>Supplied-font layout guide</title>
  <rect width="432" height="320" fill="white"/>
  <defs><path id="curve" d="M20 284 Q185 230 370 284" transform="translate(4 1) rotate(-4 195 276)"/></defs>
  <g font-family="Example" font-size="18" fill="#253749">
    <text x="20" y="27" font-size="14">SUPPLIED FONT LAYOUT</text>
    <text x="20 52 84 116" y="70" dx="0 1 -1 2" rotate="0 12 -12 0" font-size="24">PATH</text>
    <text x="20" y="108">AV <tspan font-family="Mono" font-weight="700" fill="#347a5a">Mix</tspan> <tspan font-family="Missing" fill="#a56c25">fallback</tspan></text>
    <rect x="20" y="157" width="180" height=".5" fill="#bdc8d0"/>
    <rect x="20" y="190" width="180" height=".5" fill="#bdc8d0"/>
    <text x="20" y="154" textLength="180" lengthAdjust="spacing">AV LABEL</text>
    <text x="20" y="187" textLength="180" lengthAdjust="spacingAndGlyphs">AV LABEL</text>
    <rect x="20" y="226" width="360" height=".5" fill="#bdc8d0"/>
    <text x="20" y="226" dominant-baseline="alphabetic">ABC</text>
    <text x="140" y="226" dominant-baseline="middle">ABC</text>
    <text x="260" y="226" dominant-baseline="hanging">ABC</text>
    <text font-size="18"><textPath href="#curve" startOffset="20%">CURVED PATH</textPath></text>
    <text font-size="18"><textPath href="#curve" startOffset="103%">OUT</textPath></text>
  </g>
</svg>
