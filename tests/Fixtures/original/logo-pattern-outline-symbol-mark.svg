<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <defs>
    <pattern id="p" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="4" fill="#ff0000"/>
    </pattern>
    <symbol id="m" viewBox="0 0 32 32">
      <polygon points="0,0 32,0 0,32" fill="#00ff00" stroke="url(#p)" stroke-width="4"/>
    </symbol>
  </defs>
  <use href="#m" width="64" height="64"/>
</svg>