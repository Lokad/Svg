  <title>Parkettierung mit kristallographischer Gruppe p6.</title>
  <desc>
Links oben ist das manuell zusammengestellt Muster zu sehen, in
der großen Fläche die Anwendung des Musters.

Eine Strategie der Mustererstellung:
Zunächst wird die Basisstruktur erstellt - hier Pfade, die die erwünschte Symmetrie
aufweisen. Das beabsichtigte Grundmuster wird mit ausreichend manuell angeordneten Kopien erstellt. In diesem Grundmuster wird ein rechteckiger Auschnitt gesucht, beziehungsweise berechnet, der sich als periodische Fortsetzung eignet (rot). Dies Rechteck wird sodann als Muster verwendet (große Fläche). Mittels patternTransform kann zudem das Grundmuster noch transformiert werden. Das Grundmuster kann nach erfolgreicher Erstellung natürlich einfach ins Element defs oder pattern verschoben werden, damit es nicht direkt angezeigt wird.



Gruppe p6:
Ein sechszähliges Rotationszentrum und zwei dreizählige Rotationszentren und drei zweizählige Rotationszentren.
Spiegel- oder Gleitspiegelachsen gibt es nicht.
</desc>

  <defs>
<radialGradient id="Radial1" gradientUnits="userSpaceOnUse"
     cx="0" cy="0" r="87" fx="0" fy="0">
        <stop offset="0" stop-color="#0f0" />
        <stop offset="0.5" stop-color="#2a4" />
        <stop offset="0.6" stop-color="#071" />
        <stop offset="0.9" stop-color="#020"/>
  </radialGradient>
<pattern id="pattern" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"
