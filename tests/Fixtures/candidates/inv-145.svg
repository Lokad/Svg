<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1400 1000"
     xml:lang="de"
     font-family="fantasy"
     font-size="50">

<title>Beispiel zur Maskierung</title>
<desc>
Beispiele zu Verwendung von maskUnits
userSpaceOnUse (oben) und
objectBoundingBox (unten).

In beiden Fällen werden maskContentUnits
userSpaceOnUse verwendet und die Masken sind
so gewählt, daß jeweils das gleiche Ergebnis erzielt wird.

Die Maske ist rechts dargestellt, das Objekt,
auf welche sie angewendet wird, in der Mitte
und das Ergebnis links.
</desc>

<defs>

<mask id="mask0" maskUnits="userSpaceOnUse" maskContentUnits = "userSpaceOnUse"
      x="0" y="0" width="400" height="400">
    <g id="g0" stroke-width="30">
      <rect x="50" y="50" width="300" height="300" fill="#ffa" stroke="#00f"  />
      <circle cx="350" cy="250" r="100"
            fill="#080" fill-opacity="0.5"
            stroke="#0f0" stroke-opacity="0.3" />
    </g>
</mask>

<mask id="mask1" maskUnits="objectBoundingBox" maskContentUnits = "userSpaceOnUse"
      x="0.05" y="0.05" width="0.9" height="0.9">
    <g id="g1" stroke-width="30">
      <rect x="50" y="50" width="300" height="300" fill="#ffa" stroke="#00f"  />
      <circle cx="350" cy="250" r="100"
            fill="#080" fill-opacity="0.5"
            stroke="#0f0" stroke-opacity="0.3" />
    </g>
</mask>

</defs>
<rect x="0" y="0" width="1400" height="1000" fill="#ffd" stroke="black" />

<text x="50" y="70">Ergebnis</text>
<text x="500" y="70">Objekt</text>
<text x="1000" y="70">Maske</text>

<g transform="translate(50,100)">
  <circle cx="200" cy="200" r="200" fill="#00a" mask="url(#mask0)" />

  <circle cx="650" cy="200" r="200" fill="#00a" />
  <use x="850" xlink:href="#g0" />
</g>

<g transform="translate(50,550)">
  <circle cx="200" cy="200" r="200" fill="#00a" mask="url(#mask1)" />

  <circle cx="650" cy="200" r="200" fill="#00a" />
  <use x="850" xlink:href="#g1" />
</g>



</svg>

