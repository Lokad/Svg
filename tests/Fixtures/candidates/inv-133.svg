<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG Tiny 1.1//EN"
"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11-tiny.dtd">
<svg version="1.1" baseProfile="tiny"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="-500 -500 1000 1000"
     xml:lang="de"
     fill="none"
     stroke="#ccc" stroke-width="20">

<title>transform: rotate</title>
<desc>
Blaue gerandete Rechtecke werden mittels des Attributes transform vom Typ
rotate rotiert, so daß ein rot gerandetes Rechteck komplett verdeckt
wird. Ein grau gerandetes Rechteck zeigt das nicht transformierte Rechteck.

Verschiedene Kombinationen von translate und rotate oder nur rotate können
zum gleichen Ergebnis führen, dies wird mit
den dunkler gerandeten Rechtecken angedeutet.
</desc>


<rect x="-300" y="-300" width="500" height="400" />


<path stroke="red" d="M-121.4102,-466.5064l433.0127,250 -200,346.4102 -433.0127,-250z" />


<g transform="translate(-121.4102,-466.5064)">
<rect width="500" height="400"
      transform="rotate(30)"
      stroke="blue" />
</g>

<g transform="translate(100,-50)">
<g transform="rotate(30)">
<rect x="-300" y="-300" width="500" height="400"
      transform="translate(-100,50)"
      stroke-width="14" stroke="#00a" />
</g>
</g>

<rect x="-300" y="-300" width="500" height="400"
      transform="translate(100,-50) rotate(30) translate(-100,50)"
      stroke-width="8" stroke="#007" />

<rect x="-300" y="-300" width="500" height="400"
      transform="rotate(30,100,-50)"
      stroke-width="2" stroke="#004" />


</svg>


