<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG Tiny 1.1//EN"
"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11-tiny.dtd">
<svg version="1.1" baseProfile="tiny"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="-550 -550 1100 1100"
     xml:lang="de"
     fill="none"
     stroke="#ccc" stroke-width="20" width="512" height="512">

<title>transform: skewY</title>
<desc>
Blau gerandete Rechtecke werden mittels des Attributes transform vom Typ
skewY geschert, so daß das rot gerandete Rechteck komplett verdeckt
wird. Ein grau gerandetes Rechteck zeigt das nicht transformierte Rechteck.

Gleiche Transformationstypen vertauschen immer miteinander, dies wird mit
den dunkler gerandeten Rechtecken angedeutet.
</desc>


<rect x="-400" y="-300" width="800" height="600" />


<path stroke="red" stroke-width="16"
      d="M-400,-530.9401 -400,69.0599 400,530.9401 400,-69.0599z" />

<rect x="-400" y="-300" width="800" height="600"
      transform="skewY(30)"
      stroke="blue" />

<rect x="-400" y="-300" width="800" height="600"
      transform="skewY(10) skewY(21.8519)"
      stroke="#00a" stroke-width="12"/>
<rect x="-400" y="-300" width="800" height="600"
      transform="skewY(37.0045) skewY(-10)"
      stroke="#006" stroke-width="4"/>

</svg>


