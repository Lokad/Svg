name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build Lokad.Svg.slnx -c Release --no-restore
      - run: dotnet test Lokad.Svg.slnx -c Release --no-build
      - shell: pwsh
        run: tools/test-memory-probe.ps1 -ResultsDirectory artifacts/memory-probe
      - shell: pwsh
        run: tools/test-chrome-setup.ps1 -ResultsDirectory artifacts/chrome-setup-tests
      - if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test-chrome.ps1 -CacheDirectory artifacts/chrome -ResultsDirectory artifacts/chrome-smoke
      - if: runner.os == 'Linux'
        name: Allow the pinned Chrome executable to create its sandbox
        shell: pwsh
        run: |
          $chromeExecutable = & tools/setup-chrome.ps1 -CacheDirectory artifacts/chrome -PinPath tools/chrome-for-testing.linux64.json
          $chromeSandboxPolicyPath = Join-Path $env:RUNNER_TEMP 'lokad-svg-chrome-apparmor'
          $chromeSandboxPolicyText = @"
          abi <abi/4.0>,
          include <tunables/global>
          profile lokad-svg-ci-chrome "$chromeExecutable" flags=(unconfined) {
            userns,
          }
          "@
          Set-Content -LiteralPath $chromeSandboxPolicyPath -Value $chromeSandboxPolicyText -Encoding utf8NoBOM
          & sudo apparmor_parser --replace $chromeSandboxPolicyPath
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Chrome AppArmor sandbox policy could not be loaded.' }
      - if: runner.os == 'Linux'
        shell: pwsh
        run: tools/test-chrome.ps1 -CacheDirectory artifacts/chrome -ResultsDirectory artifacts/chrome-smoke -PinPath tools/chrome-for-testing.linux64.json
      - shell: pwsh
        run: tools/test-font-probe.ps1 -ResultsDirectory artifacts/font-probe
      - shell: pwsh
        run: tools/validate-ci-artifacts.ps1 -Platform ${{ runner.os }} -ChromeDirectory artifacts/chrome-smoke -MemoryDirectory artifacts/memory-probe -RequireCurrentHost
      - shell: pwsh
        run: tools/test-validate-ci-artifacts.ps1 -ResultsDirectory artifacts/validator-selftest -Platform ${{ runner.os }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-smoke-${{ matrix.os }}
          path: artifacts/chrome-smoke
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-probe-${{ matrix.os }}
          path: artifacts/memory-probe
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-probe-${{ matrix.os }}
          path: artifacts/font-probe
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-selftest-${{ matrix.os }}
          path: artifacts/validator-selftest
          if-no-files-found: warn
      - run: dotnet pack src/Lokad.Svg/Lokad.Svg.csproj -c Release --no-build
      - shell: pwsh
        run: tools/test-package.ps1 -PackageDirectory artifacts/nuget -ResultsDirectory artifacts/package-smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            artifacts/memory-probe
            artifacts/package-smoke
          if-no-files-found: ignore
