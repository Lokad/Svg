name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build Lokad.Svg.slnx -c Release --no-restore
      - run: dotnet test Lokad.Svg.slnx -c Release --no-build
      - shell: pwsh
        run: tools/test-memory-probe.ps1 -ResultsDirectory artifacts/memory-probe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: tools/test-chrome.ps1 -CacheDirectory artifacts/chrome -ResultsDirectory artifacts/chrome-smoke
      - if: runner.os == 'Linux'
        shell: pwsh
        run: tools/test-chrome.ps1 -CacheDirectory artifacts/chrome -ResultsDirectory artifacts/chrome-smoke -PinPath tools/chrome-for-testing.linux64.json
      - shell: pwsh
        run: tools/validate-ci-artifacts.ps1 -Platform ${{ runner.os }} -ChromeDirectory artifacts/chrome-smoke -MemoryDirectory artifacts/memory-probe
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-smoke-${{ matrix.os }}
          path: artifacts/chrome-smoke
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-probe-${{ matrix.os }}
          path: artifacts/memory-probe
          if-no-files-found: warn
      - run: dotnet pack src/Lokad.Svg/Lokad.Svg.csproj -c Release --no-build -o artifacts/packages
      - shell: pwsh
        run: tools/test-package.ps1 -PackageDirectory artifacts/packages -ResultsDirectory artifacts/package-smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            artifacts/memory-probe
            artifacts/package-smoke
          if-no-files-found: ignore
