[package]
name = "lokad-svg-resvg-comparison"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
resvg = { version = "=0.49.0", default-features = false, features = ["text", "raster-images"] }
serde_json = "=1.0.150"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false
